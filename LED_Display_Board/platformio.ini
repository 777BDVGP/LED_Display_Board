; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = espidf

; Board Settings — ESP32 DevKitC, 4 MB flash
board_build.flash_mode = dio
board_build.flash_freq = 40m
board_build.partitions = partitions_led.csv

; Upload options — OTA upload matches ArduinoOTA-compatible receiver (10_OTA / stage 4)
upload_speed = 921600
monitor_speed = 115200

; firmware_out/: LED_Display_Board_v<ver>[_PRIVATE].bin (update) + _full (new board)
extra_scripts = post:tools/export_bin.py
